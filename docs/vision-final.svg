<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1120" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="22" flood-color="#10201a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- ============================ APP BACKGROUND ============================ -->
  <rect width="1920" height="1120" fill="#e9edeb"/>

  <!-- ============================ RIBBON (flat) ============================ -->
  <rect x="0" y="0" width="1920" height="92" fill="#ffffff"/>
  <line x1="0" y1="92" x2="1920" y2="92" stroke="#e2e7e4"/>

  <!-- app mark + name -->
  <rect x="16" y="14" width="26" height="26" rx="7" fill="#1d9d67"/>
  <text x="29" y="33" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Georgia, serif" font-weight="bold">√</text>
  <text x="52" y="33" font-size="17" fill="#17242b" font-weight="700">Math Canvas</text>
  <line x1="172" y1="14" x2="172" y2="40" stroke="#e2e7e4"/>
  <text x="184" y="32" font-size="12" fill="#7a8894">cinemática.mathdoc</text>
  <circle cx="330" cy="27" r="3" fill="#1d9d67"/>
  <text x="340" y="31" font-size="11" fill="#7a8894">salvo</text>

  <!-- tabs -->
  <g font-size="14">
    <rect x="420" y="8" width="66" height="30" rx="15" fill="#e6f5ee"/>
    <text x="453" y="28" text-anchor="middle" fill="#148a58" font-weight="700">Início</text>
    <text x="512" y="28" text-anchor="middle" fill="#5b6b76">Inserir</text>
    <text x="590" y="28" text-anchor="middle" fill="#5b6b76">Funções</text>
    <text x="672" y="28" text-anchor="middle" fill="#5b6b76">Gráfico</text>
    <text x="750" y="28" text-anchor="middle" fill="#5b6b76">Dados</text>
    <text x="826" y="28" text-anchor="middle" fill="#5b6b76">Python</text>
    <text x="908" y="28" text-anchor="middle" fill="#5b6b76">Exibir</text>
    <text x="980" y="28" text-anchor="middle" fill="#5b6b76">Ajuda</text>
  </g>

  <!-- flat toolbar row -->
  <g text-anchor="middle">
    <!-- Inserir -->
    <g fill="#45606e"><text x="453" y="66" font-size="16">¶</text><text x="453" y="85" font-size="9.5" fill="#5b6b76">Texto</text></g>
    <g fill="#148a58"><text x="507" y="66" font-size="15" font-family="Georgia, serif">√x</text><text x="507" y="85" font-size="9.5" font-weight="700">Equação</text></g>
    <g fill="#45606e"><text x="561" y="66" font-size="15">▤</text><text x="561" y="85" font-size="9.5" fill="#5b6b76">Tabela</text></g>
    <g fill="#e09a2f"><polyline points="606,62 614,52 626,60 636,48" fill="none" stroke="#e09a2f" stroke-width="2"/><text x="621" y="85" font-size="9.5" fill="#5b6b76">Gráfico</text></g>
    <g fill="#7a4ff0"><text x="673" y="66" font-size="13" font-family="Menlo, monospace">&lt;/&gt;</text><text x="673" y="85" font-size="9.5" font-weight="700">Código</text></g>
    <line x1="704" y1="52" x2="704" y2="88" stroke="#e8ecea"/>

    <!-- Símbolos (icons only) -->
    <g font-family="Georgia, serif" font-size="16" fill="#45606e">
      <text x="744" y="70">α</text><text x="786" y="70">θ</text><text x="828" y="70">π</text><text x="870" y="70" font-size="18">∑</text><text x="912" y="70" font-size="18">∫</text>
    </g>
    <line x1="946" y1="52" x2="946" y2="88" stroke="#e8ecea"/>

    <!-- Unidades (icons only) -->
    <g font-family="Georgia, serif" font-size="12.5" fill="#45606e">
      <text x="986" y="70">m/s</text><text x="1026" y="70">km/h</text><text x="1078" y="70">s</text><text x="1116" y="70">kg</text>
    </g>
    <line x1="1152" y1="52" x2="1152" y2="88" stroke="#e8ecea"/>

    <!-- Publicar -->
    <g fill="#45606e"><text x="1196" y="66" font-size="14">□</text><text x="1196" y="85" font-size="9.5" fill="#5b6b76">Foco</text></g>
    <g fill="#1d9d67"><text x="1250" y="66" font-size="14">⤓</text><text x="1250" y="85" font-size="9.5" font-weight="700">PDF</text></g>
    <line x1="1290" y1="52" x2="1290" y2="88" stroke="#e8ecea"/>

    <!-- Histórico -->
    <g fill="#45606e" font-size="17"><text x="1334" y="70">↶</text><text x="1378" y="70">↷</text></g>
  </g>

  <!-- ============================ PAGE (paper) ============================ -->
  <!-- peeked page behind -->
  <rect x="498" y="126" width="940" height="960" fill="#f2f5f3"/>
  <rect x="498" y="126" width="940" height="960" fill="none" stroke="#e2e7e4"/>

  <!-- main page -->
  <g filter="url(#pageShadow)">
    <rect x="490" y="118" width="940" height="960" fill="#ffffff"/>
  </g>
  <rect x="490" y="118" width="940" height="960" fill="none" stroke="#e6e9e7"/>

  <!-- page content -->
  <!-- title -->
  <text x="565" y="182" font-size="30" fill="#17242b" font-family="Georgia, serif" font-weight="bold">Cinemática do projétil</text>
  <text x="565" y="204" font-size="12.5" fill="#8a97a0">Movimento de um corpo lançado — cálculo, gráfico e simulação</text>
  <line x1="565" y1="216" x2="1355" y2="216" stroke="#ecefea"/>

  <!-- paragraph (prose with inline math) -->
  <g font-size="13.5" fill="#3a4853">
    <text x="565" y="244">Um corpo é lançado com velocidade inicial <tspan font-family="Georgia, serif">v₀</tspan> e ângulo <tspan font-family="Georgia, serif">θ</tspan>. A trajetória é</text>
    <text x="565" y="264">descrita pela função <tspan font-family="Georgia, serif">h(t)</tspan>, sob gravidade <tspan font-family="Georgia, serif">g</tspan> constante e sem atrito. Os valores</text>
    <text x="565" y="284">abaixo são definidos na própria folha e propagados para o gráfico e para o cálculo em</text>
    <text x="565" y="304">Python, atualizando os resultados automaticamente.</text>
  </g>

  <!-- math flow (no boxes) -->
  <text x="565" y="352" font-size="17" fill="#1a2733" font-family="Georgia, serif">v₀ := 20 <tspan font-size="12" fill="#7a8894">m/s</tspan></text>
  <text x="565" y="386" font-size="17" fill="#1a2733" font-family="Georgia, serif">θ := 45<tspan font-size="12" fill="#7a8894">°</tspan></text>
  <text x="565" y="420" font-size="17" fill="#1a2733" font-family="Georgia, serif">g := 9,81 <tspan font-size="12" fill="#7a8894">m/s²</tspan></text>
  <text x="565" y="464" font-size="17" fill="#1a2733" font-family="Georgia, serif">h(t) := v₀·sin(θ)·t − g·t²⁄2</text>

  <text x="565" y="512" font-size="17" fill="#1a2733" font-family="Georgia, serif">h(1 s) = <tspan fill="#148a58" font-weight="bold">5,23</tspan> <tspan font-size="12" fill="#148a58">m</tspan></text>
  <text x="716" y="512" font-size="10.5" fill="#b0bcc3" font-family="Georgia, serif">← v₀, θ, g · ao vivo ✓</text>

  <text x="565" y="548" font-size="17" fill="#1a2733" font-family="Georgia, serif">alcance = <tspan fill="#148a58" font-weight="bold">40,8</tspan> <tspan font-size="12" fill="#148a58">m</tspan></text>

  <!-- gráfico heading -->
  <text x="565" y="598" font-size="11" fill="#9aa7b0" letter-spacing="2">GRÁFICO</text>

  <!-- plot (embedded figure) -->
  <g>
    <line x1="660" y1="820" x2="1280" y2="820" stroke="#c9d3cd" stroke-width="1"/>
    <line x1="660" y1="820" x2="660" y2="620" stroke="#c9d3cd" stroke-width="1"/>
    <g stroke="#eef1ee" stroke-width="1">
      <line x1="867" y1="620" x2="867" y2="820"/><line x1="1073" y1="620" x2="1073" y2="820"/>
      <line x1="660" y1="750" x2="1280" y2="750"/><line x1="660" y1="680" x2="1280" y2="680"/>
    </g>
    <!-- parabola -->
    <path d="M 660 820 Q 970 430 1280 820" fill="none" stroke="#e09a2f" stroke-width="2.6" stroke-linecap="round"/>
    <!-- peak marker -->
    <circle cx="970" cy="625" r="4" fill="#e09a2f"/>
    <line x1="970" y1="625" x2="970" y2="820" stroke="#e8c88c" stroke-width="1" stroke-dasharray="3 4"/>
    <g font-size="10.5" fill="#9aa7b0" font-family="Georgia, serif">
      <text x="660" y="836" text-anchor="middle">0</text>
      <text x="867" y="836" text-anchor="middle">1</text>
      <text x="1073" y="836" text-anchor="middle">1,44 s</text>
      <text x="1280" y="836" text-anchor="middle">3</text>
      <text x="648" y="823" text-anchor="end">0</text>
      <text x="648" y="683" text-anchor="end">5 m</text>
      <text x="648" y="623" text-anchor="end">10 m</text>
    </g>
    <text x="1280" y="842" font-size="11" fill="#8a97a0" font-family="Georgia, serif" text-anchor="end">t (s)</text>
    <text x="660" y="612" font-size="11" fill="#8a97a0" font-family="Georgia, serif">h (m)</text>
    <!-- legend -->
    <line x1="690" y1="640" x2="722" y2="640" stroke="#e09a2f" stroke-width="2.6"/>
    <text x="730" y="644" font-size="11.5" fill="#5b6b76" font-family="Georgia, serif">h(t)</text>
  </g>
  <text x="565" y="856" font-size="12" fill="#8a97a0">Figura 1 — Trajetória <tspan font-family="Georgia, serif">h(t)</tspan>. A curva é recalculada quando <tspan font-family="Georgia, serif">v₀</tspan>, <tspan font-family="Georgia, serif">θ</tspan> ou <tspan font-family="Georgia, serif">g</tspan> mudam.</text>

  <!-- python heading -->
  <text x="565" y="902" font-size="11" fill="#9aa7b0" letter-spacing="2">PYTHON</text>

  <!-- code listing (inline on the page) -->
  <rect x="565" y="912" width="790" height="128" rx="7" fill="#f7f9f8" stroke="#e4e9e6"/>
  <rect x="565" y="912" width="3" height="128" rx="1.5" fill="#7a4ff0"/>
  <text x="1324" y="930" font-size="10" fill="#7a4ff0" font-weight="700" text-anchor="end">PYTHON</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#2b3640">
    <text x="586" y="938"><tspan fill="#8a4fd0">import</tspan> numpy <tspan fill="#8a4fd0">as</tspan> np</text>
    <text x="586" y="960">raizes = np.roots([-g/2, v0·sin(θ), 0])</text>
    <text x="586" y="982"><tspan fill="#8a4fd0">export</tspan>(tempo_voo = raizes[1])</text>
  </g>
  <line x1="575" y1="996" x2="1345" y2="996" stroke="#e4e9e6"/>
  <text x="586" y="1022" font-family="Menlo, monospace" font-size="12.5" fill="#148a58">→ tempo_voo = 2,88 s</text>

  <!-- page footer -->
  <text x="960" y="1056" font-size="12" fill="#b8c2c7" text-anchor="middle" font-family="Georgia, serif">1</text>

  <!-- ============================ STATUS BAR ============================ -->
  <rect x="0" y="1092" width="1920" height="28" fill="#f0f3f1"/>
  <line x1="0" y1="1092" x2="1920" y2="1092" stroke="#dfe5e1"/>
  <circle cx="16" cy="1106" r="4" fill="#1d9d67"/>
  <text x="26" y="1110" font-size="12" fill="#45606e">Pronto</text>
  <g font-size="12" fill="#7a8894">
    <text x="96" y="1110">Compute Engine <tspan fill="#1d9d67">✓</tspan></text>
    <circle cx="250" cy="1106" r="4" fill="#9aa7b0"/>
    <text x="260" y="1110">Python · idle</text>
    <text x="1720" y="1110" text-anchor="end">Python 3.12 · Compute Engine 0.151 · reproduzível ✓</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#45606e">
    <text x="900" y="1110">−</text>
    <text x="960" y="1110">100%</text>
    <text x="1020" y="1110">+</text>
  </g>
</svg>
